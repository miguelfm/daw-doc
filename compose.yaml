# Documentación sen conexión para DAW: manual de PHP, DevDocs e Laravel.
# Os valores ${...} teñen valor por defecto; pódense cambiar nun .env.
# As imaxes constrúense unha vez con rede (scripts/empaquetar.sh) e
# cárganse despois sen rede (scripts/instalar.sh). Con restart:
# unless-stopped, os contedores volven arrancar cando arranca Docker.
# daw-dev usa as mesmas imaxes e portos no seu perfil doc (daw-start-doc).
name: daw-doc

services:
  # Manual oficial de PHP, co buscador Pagefind, servido con nginx
  php-manual:
    build:
      context: ./php-manual
      args:
        PHP_MANUAL_LANG: ${PHP_MANUAL_LANG:-en}
    image: ${DAW_DOC_IMAGE:-ghcr.io/miguelfm/daw-doc}-php:${PHP_MANUAL_LANG:-en}
    container_name: daw-doc-php
    ports:
      - "${PHP_MANUAL_PORT:-8080}:80"
    restart: unless-stopped

  # DevDocs coas linguaxes de DEVDOCS_LANGS
  devdocs:
    build:
      context: ./devdocs
      args:
        DEVDOCS_LANGS: ${DEVDOCS_LANGS:-html css}
    image: ${DAW_DOC_IMAGE:-ghcr.io/miguelfm/daw-doc}-devdocs:latest
    container_name: daw-doc-devdocs
    ports:
      - "${DEVDOCS_PORT:-5042}:9292"
    restart: unless-stopped

  # Documentación de Laravel, co buscador lunr.js
  laravel-docs:
    build:
      context: ./laravel-docs
      args:
        LARAVEL_VERSION: ${LARAVEL_VERSION:-12.x}
    image: ${DAW_DOC_IMAGE:-ghcr.io/miguelfm/daw-doc}-laravel:${LARAVEL_VERSION:-12.x}
    container_name: daw-doc-laravel
    ports:
      - "${LARAVEL_DOCS_PORT:-8088}:80"
    restart: unless-stopped
